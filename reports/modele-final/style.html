<style>
/* Layout: technical note, same identity as the earlier verification report. One reading column (~68 chars)
   inside a 1000 px frame that figures, tables and the map viewer fill. Summary, tests, references, maps. */
:root {
  --page: #f4f5f1;
  --surface: #fcfcfb;
  --ink: #11150f;
  --ink-2: #4b5148;
  --muted: #73796f;
  --rule: #dcdfd6;
  --grid: #e4e5de;
  --axis: #c3c2b7;
  --accent: #1c5cab;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --neutral-bar: #b9bdb2;
  --g-test: #9a9f94;
  --good: #0ca30c;
  --band: rgba(17, 21, 15, 0.06);
  --nodata-a: #e6e8e2;
  --nodata-b: #d9dcd4;
  --tip-bg: #11150f;
  --tip-ink: #f0efec;
  --tip-ink-2: #c3c2b7;
  --f-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Source Code Pro", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0f110e; --surface: #1a1a19; --ink: #eeefea; --ink-2: #c3c2b7; --muted: #959990;
    --rule: #2e302b; --grid: #2a2b28; --axis: #4a4c46; --accent: #86b6ef;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --neutral-bar: #5d6058; --g-test: #7d8279;
    --band: rgba(255, 255, 255, 0.07); --nodata-a: #2a2c29; --nodata-b: #232522;
    --tip-bg: #f0efec; --tip-ink: #11150f; --tip-ink-2: #4b5148;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0f110e; --surface: #1a1a19; --ink: #eeefea; --ink-2: #c3c2b7; --muted: #959990;
  --rule: #2e302b; --grid: #2a2b28; --axis: #4a4c46; --accent: #86b6ef;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --neutral-bar: #5d6058; --g-test: #7d8279;
  --band: rgba(255, 255, 255, 0.07); --nodata-a: #2a2c29; --nodata-b: #232522;
  --tip-bg: #f0efec; --tip-ink: #11150f; --tip-ink-2: #4b5148;
  color-scheme: dark;
}

body { background: var(--page); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
.wrap {
  max-width: 1000px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 72px;
  display: grid; gap: 56px;
}
section { display: grid; gap: 18px; min-width: 0; }
.prose { max-width: 68ch; display: grid; gap: 14px; min-width: 0; }
.prose p, .prose ul, .prose ol { margin: 0; }
.prose ul, .prose ol { padding-left: 1.2em; display: grid; gap: 6px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(30px, 5vw, 44px); line-height: 1.1; font-weight: 700; }
h2 { font-size: clamp(23px, 3.2vw, 29px); line-height: 1.2; font-weight: 700; }
h3 { font-size: 20px; line-height: 1.3; font-weight: 600; }
a { color: var(--accent); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
code { font-family: var(--f-mono); font-size: 0.85em; background: var(--band); padding: 0.05em 0.3em; border-radius: 3px; overflow-wrap: anywhere; }
strong { font-weight: 600; }
.eyebrow { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.lede { font-size: 19px; line-height: 1.55; max-width: 66ch; margin: 0; }
.meta { font-size: 14px; color: var(--ink-2); margin: 0; max-width: 80ch; }
header { display: grid; gap: 16px; }
.section-head { display: grid; gap: 6px; border-top: 1px solid var(--rule); padding-top: 22px; }
.section-head p { margin: 0; color: var(--ink-2); max-width: 70ch; }
.small { font-size: 14px; color: var(--ink-2); margin: 0; }

.verdict { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 22px 24px; display: grid; gap: 14px; }
.verdict h2 { font-size: 22px; }
.verdict ul { margin: 0; padding-left: 1.2em; display: grid; gap: 8px; max-width: 76ch; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.tile { border-top: 2px solid var(--ink); padding-top: 10px; display: grid; gap: 2px; align-content: start; }
.tile .label { font-size: 14px; color: var(--ink-2); }
.tile .value { font-size: 30px; font-weight: 600; line-height: 1.15; font-variant-numeric: tabular-nums; }
.tile .note { font-size: 14px; color: var(--ink-2); }

figure { margin: 0; display: grid; gap: 10px; min-width: 0; }
.fig { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 18px 18px 14px; display: grid; gap: 12px; min-width: 0; }
.fig-title { font-weight: 600; font-size: 16px; margin: 0; }
.fig-sub { font-size: 14px; color: var(--ink-2); margin: 0; }
figcaption { font-size: 15px; color: var(--ink-2); max-width: 76ch; }
.chart { min-width: 0; position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.pair > div { display: grid; gap: 6px; min-width: 0; align-content: start; }
.panel-title { font-size: 14px; font-weight: 600; margin: 0; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; align-items: start; }
.cols > * { min-width: 0; }
.callout { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 16px 20px; display: grid; gap: 8px; max-width: 78ch; }
.callout p, .callout ul { margin: 0; }
.callout ul { padding-left: 1.2em; display: grid; gap: 4px; }

.legend { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 14px; color: var(--ink-2); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.key-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.key-ring { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; border: 2px solid var(--s1); box-sizing: border-box; }
.key-bar { width: 14px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }
.key-line { width: 20px; height: 0; border-top: 2px solid; display: inline-block; flex: none; }
.key-line.dash { border-top-style: dashed; opacity: 0.55; }
.key-diamond { width: 8px; height: 8px; transform: rotate(45deg); border: 1.5px solid var(--ink); display: inline-block; flex: none; background: var(--surface); }
.ramp { display: inline-flex; align-items: center; gap: 8px; }
.ramp i { width: 110px; height: 9px; border-radius: 4px; display: inline-block; background: linear-gradient(90deg, #f6f9fd, #cde2fb, #86b6ef, #3987e5, #1c5cab, #0d366b); }
.ramp-nodata i { width: 18px; background: repeating-linear-gradient(45deg, var(--nodata-a) 0 3px, var(--nodata-b) 3px 6px); border: 1px solid var(--rule); }

/* SVG */
.grid { stroke: var(--grid); stroke-width: 1; }
.axis { stroke: var(--axis); stroke-width: 1; }
.tick { fill: var(--muted); font-size: 12px; font-family: var(--f-body); font-variant-numeric: tabular-nums; }
.axt { fill: var(--ink-2); font-size: 13px; font-family: var(--f-body); }
.lab { fill: var(--ink-2); font-size: 12px; font-family: var(--f-body); }
.lab-strong { fill: var(--ink); font-size: 13px; font-weight: 600; font-family: var(--f-body); font-variant-numeric: tabular-nums; }
.halo { paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.ref { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 2 3; }
.line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.line.dash { stroke-dasharray: 5 4; opacity: 0.5; }
.dot { stroke: var(--surface); stroke-width: 2; }
.land { fill: var(--surface); stroke: var(--axis); stroke-width: 1; }
.neighbour { fill: none; stroke: var(--grid); stroke-width: 1; }
.foldband { fill: var(--band); }
.hit { fill: transparent; cursor: default; }
.hit:focus { outline: none; }
.hit:focus-visible { stroke: var(--ink); stroke-width: 1.5; }
.hit.is-hover { fill: var(--band); }

#tip { position: fixed; z-index: 20; pointer-events: none; background: var(--tip-bg); color: var(--tip-ink); border-radius: 6px; padding: 8px 10px;
  font-size: 13px; line-height: 1.35; max-width: 300px; display: grid; gap: 3px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18); }
.tip-row { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.tip-row strong { font-weight: 700; font-variant-numeric: tabular-nums; }
.tip-l { color: var(--tip-ink-2); }
.tip-key { width: 12px; height: 3px; border-radius: 1px; display: inline-block; align-self: center; }

details.data { font-size: 14px; }
details.data summary { cursor: pointer; color: var(--accent); width: fit-content; }
.tbl-wrap { overflow-x: auto; min-width: 0; }
details .tbl-wrap { margin-top: 8px; }
table { border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; width: 100%; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-weight: 600; color: var(--ink-2); font-size: 13px; }
td.num, th.num { text-align: right; white-space: nowrap; }
tr.is-final td { font-weight: 600; }
tr.is-final td:first-child { box-shadow: inset 3px 0 0 var(--s1); }
.sub { color: var(--muted); font-weight: 400; }
.status { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; white-space: nowrap; }
.status svg { width: 16px; height: 16px; flex: none; }
.st-good { fill: var(--good); }

/* Map viewer */
.viewer { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 16px; display: grid; gap: 14px; min-width: 0; }
.picker { display: grid; gap: 10px; }
.pick-group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pick-group .titre { font-size: 13px; color: var(--ink-2); font-weight: 600; min-width: 190px; display: inline-flex; align-items: center; gap: 6px; }
.pick-group button {
  font: inherit; font-size: 13px; font-variant-numeric: tabular-nums; cursor: pointer;
  background: var(--page); color: var(--ink); border: 1px solid var(--rule); border-radius: 999px; padding: 3px 10px;
}
.pick-group button:hover { border-color: var(--axis); }
.pick-group button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.v-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; border-top: 1px solid var(--rule); padding-top: 12px; }
.v-head .nom { font-weight: 600; font-size: 17px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }
.v-stats { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.v-stats b { color: var(--ink); font-weight: 600; }
.v-top, .v-bot { display: grid; gap: 10px; }
.v-top { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.v-bot { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.v-panel { display: grid; gap: 5px; min-width: 0; margin: 0; }
.v-panel figcaption { font-size: 13px; color: var(--ink-2); display: flex; justify-content: space-between; gap: 8px; }
.v-panel figcaption b { color: var(--ink); font-weight: 600; }
.v-img { position: relative; aspect-ratio: 1 / 1; border-radius: 6px; overflow: hidden; border: 1px solid var(--rule); touch-action: none;
  background: repeating-linear-gradient(45deg, var(--nodata-a) 0 6px, var(--nodata-b) 6px 12px); cursor: crosshair; }
.v-img img, .v-img canvas { display: block; width: 100%; height: 100%; object-fit: fill; image-rendering: auto; }
.v-mark { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 2px solid #fff;
  box-shadow: 0 0 0 1.5px #11150f; pointer-events: none; }
.v-read { min-height: 50px; font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: center; font-variant-numeric: tabular-nums;
  background: var(--page); border-radius: 6px; padding: 8px 12px; }
.v-read .lbl { color: var(--ink-2); }
.v-read b { font-weight: 600; }
.v-legend { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 13px; color: var(--ink-2); align-items: center; }
.v-status { font-size: 14px; color: var(--ink-2); }
@media (max-width: 560px) { .v-bot { gap: 6px; } .v-panel figcaption { font-size: 12px; flex-direction: column; gap: 0; } }

ol.plain { padding-left: 1.2em; margin: 0; display: grid; gap: 6px; }
@media (max-width: 520px) {
  body { font-size: 16px; }
  .wrap { gap: 44px; padding-block: 28px 56px; }
  .fig, .viewer { padding: 12px; }
  .tile .value { font-size: 26px; }
  .pick-group .titre { min-width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
